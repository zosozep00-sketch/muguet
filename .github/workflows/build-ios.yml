name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # 1. Installa il target in modo sicuro
          rustup target add aarch64-apple-ios
          
          # 2. Compila preventivamente tutte le dipendenze forzando il target iOS corretto
          cargo build --target aarch64-apple-ios --release
          
          # 3. Lancia lo script finale che ora troverà i pacchetti (tra cui bitflags) già pronti
          FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh --ipa
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
