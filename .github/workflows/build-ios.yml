name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # 1. Installiamo esattamente la versione di Rust pretesa dal progetto
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          
          # 2. Installiamo il target iOS specificatamente dentro questa versione
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          
          # 3. Lanciamo lo script di Muguet
          FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh --ipa
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
