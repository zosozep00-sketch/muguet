name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # Forza l'installazione del target iOS nel toolchain attivo prima di compilare
          rustup target add aarch64-apple-ios
          
          FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh --ipa
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
