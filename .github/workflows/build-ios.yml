name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # Rimuove i file di configurazione locale di Rust che bloccano il target iOS
          rm -f rust-toolchain
          rm -f rust-toolchain.toml
          
          # Imposta la versione stabile globale e installa il target
          rustup default stable
          rustup target add aarch64-apple-ios
          
          FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh --ipa
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
