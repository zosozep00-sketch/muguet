name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # Identifica la versione di Rust richiesta dal progetto e forza l'installazione del target al suo interno
          ACTIVE_TOOLCHAIN=$(rustup show active-toolchain | awk '{print $1}')
          rustup target add aarch64-apple-ios --toolchain $ACTIVE_TOOLCHAIN
          
          # Aggiunge il target anche come comportamento predefinito globale
          rustup default stable
          rustup target add aarch64-apple-ios
          
          FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh --ipa
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
