name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build IPA
        run: |
          # 1. Installa la versione corretta di Rust e il target iOS
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          
          # 2. Verifica se il file game.zip esiste e avvia la compilazione completa
          if [ -f "game.zip" ]; then
            echo "File game.zip trovato! Avvio la compilazione del gioco..."
            FREE=1 BUNDLE_ID=com.muguet.mytarget ./make-ios.sh game.zip --ipa
          else
            echo "ERRORE: game.zip non trovato nella cartella principale!"
            exit 1
          fi
        continue-on-error: true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muguet-iOS-IPA
          path: build/*.ipa
